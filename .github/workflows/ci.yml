name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    permissions:
      contents: read
    uses: abijith-suresh/workflows/.github/workflows/ci.yml@a53b4c876bca362ca058c99c01c4c0a955d71c9d # 0.7.0

  dependency-review:
    name: dependency-review
    uses: abijith-suresh/workflows/.github/workflows/dependency-review.yml@a53b4c876bca362ca058c99c01c4c0a955d71c9d # 0.7.0
    permissions:
      contents: read

  gate:
    name: gate
    if: ${{ !cancelled() }}
    needs: [ci, dependency-review]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require CI success
        shell: bash
        env:
          CI_RESULT: ${{ needs.ci.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
        run: |
          set -euo pipefail
          if [[ "$CI_RESULT" != success ]]; then
            echo "ci result: $CI_RESULT" >&2
            exit 1
          fi
          if [[ "$DEPENDENCY_REVIEW_RESULT" != success ]]; then
            echo "dependency-review result: $DEPENDENCY_REVIEW_RESULT" >&2
            exit 1
          fi
